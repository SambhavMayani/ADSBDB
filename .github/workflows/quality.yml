name: EcoSentinel quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ANONYMIZED_TELEMETRY: 'False'
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: CPU runtime
        run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Static analysis and consistent Python formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Offline contracts, real temporary Chroma and HTTP end-to-end
        run: python -m pytest -q --cov=orchestration --cov=exploitation_zone --cov=trusted_zone --cov=formatted_zone --cov=landing_zone --cov=multimodal_tasks --cov=webapp --cov-fail-under=60 --cov-report=xml:reports/validation/coverage.xml --junitxml=reports/validation/offline.xml
      - name: Pure execution plan
        run: python -m orchestration.pipeline --plan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: reports/validation/
  storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: docker compose -p ecosentinel-ci -f docker-compose.test.yml up -d
      - name: Wait for isolated storage
        shell: python
        run: |
          import time
          import urllib.request
          for attempt in range(20):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:19000/minio/health/ready', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Isolated MinIO did not become ready')
      - run: python -m pytest -m integration -q --junitxml=reports/validation/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-integration
          path: reports/validation/
      - if: always()
        run: docker compose -p ecosentinel-ci -f docker-compose.test.yml down
